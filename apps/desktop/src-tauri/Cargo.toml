[package]
name = "dabar-tauri"
version = "0.1.0"
description = "Dabar desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "dabar_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dabar-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
dabar-core = { path = "../../../packages/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.39", features = ["full"] }
